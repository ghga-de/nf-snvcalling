name: Main
# This workflow runs the pipeline with the minimal test dataset to check that it completes without any syntax errors
on:
  push:
    branches:
      - dev
      - main
  pull_request:
  release:
    types: [published]

# Uncomment if we need an edge release of Nextflow again
# env: NXF_EDGE: 1

# Cancel any in-progress runs of this workflow for the same ref when a new run starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge pull request')) }}
    name: Run workflow tests
    runs-on: ubuntu-latest
    env:
      NXF_VER: ${{ matrix.nxf_ver }}
      NXF_ANSI_LOG: false
    strategy:
      matrix:
        # Nextflow versions: check pipeline minimum and current latest
        nxf_ver: ["23.10.3"]
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        env:
          CAPSULE_LOG: none
        run: |
          wget -qO- get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash -s 0.9.2
          sudo mv nf-test /usr/local/bin/
      - name: HELPTEXT Run with the help flag
        run: |
          nextflow run ${GITHUB_WORKSPACE} --help
      - name: DELAY to try address some odd behaviour with what appears to be a conflict between parallel htslib jobs leading to CI hangs
        run: |
          if [[ $NXF_VER = '' ]]; then sleep 1200; fi
      - name: BASIC Run the pipeline test (tests/main.nf.test) with docker
        run: |
          nf-test test --tag ci --profile test,docker --verbose
      # Without a committed CI snapshot, the run above creates one: download it from the
      # run's artifacts and commit it as tests/main.nf.test.snap
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-snapshot
          path: tests/main.nf.test.snap
          if-no-files-found: ignore
